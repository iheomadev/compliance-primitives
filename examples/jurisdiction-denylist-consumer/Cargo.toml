[package]
name = "jurisdiction-denylist-consumer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Example token contract combining jurisdiction-flag and denylist-gate checks before transferring."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
denylist-gate = { path = "../../contracts/denylist-gate", features = ["testutils"] }
jurisdiction-flag = { path = "../../contracts/jurisdiction-flag", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
