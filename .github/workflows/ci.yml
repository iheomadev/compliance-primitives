name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose
      - name: Run doc tests
        run: cargo test --workspace --doc --verbose

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  budget-regression:
    name: budget regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run budget regression tests
        run: cargo test --workspace budget_regression -- --nocapture

  wasm-build:
    name: wasm32v1-none build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build contracts to wasm
        run: cargo build --workspace --target wasm32v1-none --release

  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2

  docs-interfaces-diff:
    name: docs/interfaces diff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install stellar CLI
        run: |
          curl -s https://raw.githubusercontent.com/stellar/stellar-cli/master/install.sh | bash
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Regenerate interface docs
        run: ./scripts/regenerate-docs.sh
      - name: Check for differences
        run: |
          if git diff --exit-code docs/interfaces/ > /dev/null; then
            echo "✓ docs/interfaces is up to date"
          else
            echo "✗ docs/interfaces is out of date. Run ./scripts/regenerate-docs.sh and commit the changes."
            git diff docs/interfaces/
            exit 1
          fi
